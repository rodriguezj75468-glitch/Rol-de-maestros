<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario y Asistencias - Clases Dominicales</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap');

        :root {
            --bg-color: #0b0f19;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-1: #3b82f6;
            --accent-2: #10b981;
            --accent-3: #f59e0b;
            --accent-4: #8b5cf6;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --glow-color: rgba(99, 102, 241, 0.15);
            --present-color: #10b981;
            --late-color: #f59e0b;
            --absent-color: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 25%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Light Theme support */
        body.bg-theme-light {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-border: rgba(0, 0, 0, 0.08);
            --glow-color: rgba(99, 102, 241, 0.05);
            
            background: #f1f5f9;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.04) 0%, transparent 25%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.04) 0%, transparent 25%);
        }

        header {
            text-align: center;
            padding: 2.5rem 2rem 1.5rem;
            max-width: 1200px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        .back-link {
            position: absolute;
            left: 2rem;
            top: 2.8rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: var(--text-main);
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateX(-3px);
        }

        body.bg-theme-light .back-link {
            background: rgba(0, 0, 0, 0.02);
        }

        body.bg-theme-light .back-link:hover {
            background: rgba(99, 102, 241, 0.08);
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            animation: fadeIn 1s ease-out;
        }

        body.bg-theme-light h1 {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            animation: fadeIn 1.2s ease-out;
        }

        /* Responsive grid layout */
        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            width: 90%;
            max-width: 1200px;
            margin: 0 auto 4rem;
            box-sizing: border-box;
        }

        @media (min-width: 1024px) {
            .container {
                grid-template-columns: 1.3fr 1fr;
            }
        }

        /* Glassmorphism Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 1.8rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        body.bg-theme-light .card {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
        }

        .card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 750;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, #a5b4fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.bg-theme-light .card-title {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Calendar Styles */
        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .calendar-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-main);
            padding: 0.6rem 1.1rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            font-family: 'Outfit', sans-serif;
        }

        .calendar-btn:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
        }

        body.bg-theme-light .calendar-btn {
            background: rgba(0, 0, 0, 0.03);
        }

        .current-month-year {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-main);
            text-transform: capitalize;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
            text-align: center;
        }

        .weekday-label {
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            padding: 0.5rem 0;
            letter-spacing: 0.5px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 255, 255, 0.02);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .day-cell:hover:not(.empty-cell) {
            background: rgba(99, 102, 241, 0.12);
            border-color: rgba(99, 102, 241, 0.3);
            transform: scale(1.05);
        }

        .day-cell.empty-cell {
            background: transparent;
            border-color: transparent;
            cursor: default;
        }

        .day-cell.selected-day {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.35), rgba(124, 58, 237, 0.35)) !important;
            border: 2px solid #818cf8 !important;
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.25);
            color: #ffffff;
        }

        .day-cell.today {
            border: 2px dashed var(--accent-1);
            color: #60a5fa;
            font-weight: 800;
        }

        .day-cell.sunday-cell {
            border: 1.5px solid rgba(16, 185, 129, 0.35);
            background: rgba(16, 185, 129, 0.04);
        }

        body.bg-theme-light .day-cell.sunday-cell {
            background: rgba(16, 185, 129, 0.02);
            border-color: rgba(16, 185, 129, 0.15);
        }

        /* Birthday indicator */
        .day-cell.has-birthday {
            background: rgba(236, 72, 153, 0.08);
            border-color: rgba(236, 72, 153, 0.25);
        }

        .day-cell.has-birthday::after {
            content: '🎂';
            font-size: 0.65rem;
            position: absolute;
            bottom: 3px;
            right: 3px;
        }

        body.bg-theme-light .day-cell {
            background: rgba(0, 0, 0, 0.01);
            border-color: rgba(0, 0, 0, 0.02);
        }

        body.bg-theme-light .day-cell.has-birthday {
            background: rgba(236, 72, 153, 0.05);
            border-color: rgba(236, 72, 153, 0.2);
        }

        /* Attendance controls */
        .attendance-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid var(--card-border);
            padding: 0.8rem 1.2rem;
            border-radius: 14px;
            box-sizing: border-box;
        }

        body.bg-theme-light .attendance-info-bar {
            background: rgba(255, 255, 255, 0.5);
        }

        .selected-date-lbl {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .attendance-stats-summary {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            gap: 0.75rem;
        }

        .stat-badge {
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
            color: #ffffff;
            font-weight: 700;
        }

        .stat-badge.stat-present { background-color: var(--present-color); }
        .stat-badge.stat-late { background-color: var(--late-color); }
        .stat-badge.stat-absent { background-color: var(--absent-color); }

        .kids-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .kid-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid var(--card-border);
            padding: 0.8rem 1rem;
            border-radius: 16px;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .kid-row:hover {
            background: rgba(15, 23, 42, 0.5);
            border-color: rgba(255,255,255,0.12);
        }

        body.bg-theme-light .kid-row {
            background: rgba(255, 255, 255, 0.6);
        }

        body.bg-theme-light .kid-row:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .kid-info {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .kid-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2);
        }

        .kid-name-container {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .kid-name {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
        }

        .kid-birthday-tag {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .attendance-actions {
            display: flex;
            gap: 0.4rem;
        }

        .attendance-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        body.bg-theme-light .attendance-btn {
            background: rgba(0, 0, 0, 0.02);
        }

        .attendance-btn:hover {
            transform: scale(1.08);
        }

        /* Specific states for buttons */
        .attendance-btn.btn-p:hover,
        .attendance-btn.btn-p.active {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--present-color);
            color: var(--present-color);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        .attendance-btn.btn-a:hover,
        .attendance-btn.btn-a.active {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--absent-color);
            color: var(--absent-color);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
        }

        /* Birthdays list block */
        .birthday-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 0.75rem;
        }

        .birthday-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 0.85rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .birthday-item:hover {
            transform: translateY(-2px);
            background: rgba(236, 72, 153, 0.04);
            border-color: rgba(236, 72, 153, 0.25);
        }

        body.bg-theme-light .birthday-item {
            background: rgba(255, 255, 255, 0.5);
        }

        body.bg-theme-light .birthday-item:hover {
            background: rgba(236, 72, 153, 0.02);
        }

        .birthday-item.active-birthday-month {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.15), rgba(139, 92, 246, 0.15)) !important;
            border-color: rgba(236, 72, 153, 0.4) !important;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.15);
        }

        .birthday-item.active-birthday-day {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.3), rgba(168, 85, 247, 0.3)) !important;
            border-color: rgba(236, 72, 153, 0.8) !important;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.35);
            transform: scale(1.02);
        }

        .selected-birthday-banner {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.18), rgba(168, 85, 247, 0.18));
            border: 1px solid rgba(236, 72, 153, 0.5);
            border-radius: 16px;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.25);
            margin-top: 0.75rem;
            animation: slideUp 0.3s ease-out;
        }

        .birthday-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(236, 72, 153, 0.15);
            color: #ec4899;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .birthday-name {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .birthday-date {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Attendance rate chart list */
        .rate-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .rate-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.82rem;
        }

        .rate-name {
            width: 80px;
            font-weight: 600;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rate-bar-bg {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        body.bg-theme-light .rate-bar-bg {
            background: rgba(0, 0, 0, 0.04);
        }

        .rate-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            border-radius: 4px;
            width: 0%;
            transition: width 0.8s ease-out;
        }

        .rate-val {
            width: 35px;
            font-weight: 750;
            color: var(--text-muted);
        }

        /* Keyframes */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.1rem; }
            header { padding: 2rem 1rem 1rem; }
            .back-link { position: static; margin-bottom: 1rem; transform: none !important; }
            .card { padding: 1.25rem; }
            .day-cell { font-size: 0.85rem; }
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="back-link">
            <span>⬅️</span> Volver al Planeador
        </a>
        <h1>Calendario y Cumpleaños</h1>
        <div class="subtitle">Consulta de Fechas y Cumpleaños del Grupo 🎂</div>

    <div class="container">
        <!-- Columna Izquierda: Calendario -->
        <div class="card">
            <div class="card-title">
                <span>📅</span> Calendario Mensual
            </div>

            <div class="calendar-controls">
                <button class="calendar-btn" onclick="prevMonth()">◀ Anterior</button>
                <div class="current-month-year" id="currentMonthYear">Julio 2026</div>

            </div>

            <div class="calendar-grid" id="calendarGrid">
                <!-- Se llenará dinámicamente -->
            </div>
        </div>

        <!-- Columna Derecha: Fecha Seleccionada y Cumpleaños -->
        <div style="display: flex; flex-direction: column; gap: 2rem;">
            
            <!-- Tarjeta de Fecha Seleccionada -->
            <div class="card">
                <div class="card-title">
                    <span>🗓️</span> Fecha Seleccionada
                </div>

                <div class="attendance-info-bar" style="margin-bottom: 0;">
                    <div class="selected-date-lbl" id="selectedDateLabel">12 de Julio, 2026</div>
                </div>

                <div id="selectedDateBirthdayBanner" class="selected-birthday-banner" style="display: none;"></div>
            </div>

            <!-- Tarjeta de Cumpleaños del Grupo -->
            <div class="card">
                <div class="card-title">
                    <span>🎂</span> Cumpleaños del Grupo
                </div>
                <div class="birthday-grid" id="birthdaysGrid">
                    <!-- Se llenará dinámicamente -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- 🎂 LISTA DE NIÑOS Y CUMPLEAÑOS ---
        const kidsData = [

            { id: "ana_quintero", name: "Ana Quintero", birthMonth: 7, birthDay: 13, initial: "A" },
            { id: "dylan", name: "Dylan", birthMonth: 7, birthDay: 14, initial: "D" },

            { id: "ramon_m", name: "Ramón (Maestro)", birthMonth: 11, birthDay: 10, initial: "R", isTeacher: true },
            { id: "tania", name: "Tania", birthMonth: 11, birthDay: 17, initial: "T" }
        ];

        const monthNames = [
            "enero", "febrero", "marzo", "abril", "mayo", "junio",
            "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"
        ];

        // Fecha actual de trabajo (por defecto hoy o inicio de julio 2026 para coincidir con el planner)
        let currentDate = new Date();
        // Si estamos fuera del rango del planner (junio-agosto 2026), podemos forzar a Julio 2026 como demo
        if (currentDate.getFullYear() !== 2026) {
            currentDate = new Date(2026, 6, 1); // 1 de Julio 2026
        }
        
        let selectedDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate());

        // --- 🎨 INICIALIZAR FONDO / TEMA ---
        function initBackground() {
            const savedBg = localStorage.getItem('preferredBackground') || 'dark';
            document.body.classList.remove('bg-theme-light', 'bg-theme-dark');
            document.body.classList.add(`bg-theme-${savedBg}`);
        }

        // --- 📅 RENDERIZAR CALENDARIO ---
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Actualizar título del mes
            const monthTitleEl = document.getElementById("currentMonthYear");
            monthTitleEl.innerText = `${monthNames[month]} ${year}`;

            const gridEl = document.getElementById("calendarGrid");
            gridEl.innerHTML = "";

            // Etiquetas de días de la semana
            const weekDays = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
            weekDays.forEach(day => {
                const label = document.createElement("div");
                label.className = "weekday-label";
                label.innerText = day;
                gridEl.appendChild(label);
            });

            // Primer día del mes y número total de días
            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            // Celdas vacías previas
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement("div");
                emptyCell.className = "day-cell empty-cell";
                gridEl.appendChild(emptyCell);
            }

            // Celdas de días
            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement("div");
                cell.className = "day-cell";
                cell.innerText = day;

                const thisDate = new Date(year, month, day);

                // Comprobar si es el día seleccionado
                if (thisDate.toDateString() === selectedDate.toDateString()) {
                    cell.classList.add("selected-day");
                }

                // Comprobar si es hoy real
                const todayReal = new Date();
                if (thisDate.toDateString() === todayReal.toDateString()) {
                    cell.classList.add("today");
                }

                // Comprobar si es domingo (asistencia solo domingos)
                if (thisDate.getDay() === 0) {
                    cell.classList.add("sunday-cell");
                }

                // Comprobar cumpleaños en esta fecha
                const birthdaysToday = kidsData.filter(k => k.birthMonth === month && k.birthDay === day);
                if (birthdaysToday.length > 0) {
                    cell.classList.add("has-birthday");
                    const names = birthdaysToday.map(k => k.name).join(", ");
                    cell.title = `Cumpleaños de: ${names}`;
                }

                // Evento click para seleccionar el día
                cell.onclick = () => {
                    selectedDate = thisDate;
                    renderCalendar();
                    renderSelectedDateDetails();
                    renderBirthdays();
                };

                gridEl.appendChild(cell);
            }
        }

        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
            renderBirthdays();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
            renderBirthdays();
        }

        // --- 📅 DETALLES DE FECHA SELECCIONADA Y CUMPLEAÑOS ---
        function renderSelectedDateDetails() {
            // Actualizar etiqueta de fecha seleccionada
            const labelEl = document.getElementById("selectedDateLabel");
            const dayNum = selectedDate.getDate();
            const monthName = monthNames[selectedDate.getMonth()];
            const yearNum = selectedDate.getFullYear();
            labelEl.innerText = `${dayNum} de ${monthName.charAt(0).toUpperCase() + monthName.slice(1)}, ${yearNum}`;

            // Banner desplegable para cumpleaños de la fecha seleccionada
            const selMonth = selectedDate.getMonth();
            const selDay = selectedDate.getDate();
            const birthdaysOnSelectedDate = kidsData.filter(k => k.birthMonth === selMonth && k.birthDay === selDay);
            const birthdayBanner = document.getElementById("selectedDateBirthdayBanner");

            if (birthdayBanner) {
                if (birthdaysOnSelectedDate.length > 0) {
                    const namesList = birthdaysOnSelectedDate.map(k => `<strong>${k.name}</strong>`).join(", ");
                    birthdayBanner.innerHTML = `
                        <div style="font-size: 1.8rem; line-height: 1;">🎂</div>
                        <div>
                            <div style="font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 800; color: #ec4899;">
                                🎉 ¡CUMPLEAÑOS EN ESTA FECHA!
                            </div>
                            <div style="font-size: 0.88rem; color: var(--text-main); margin-top: 0.25rem; line-height: 1.3;">
                                🎈 Hoy celebra(n) su cumpleaños: ${namesList}. ¡Muchas felicidades!
                            </div>
                        </div>
                    `;
                    birthdayBanner.style.display = "flex";
                } else {
                    birthdayBanner.style.display = "none";
                }
            }
        }

        // --- 🎂 RENDERIZAR CUMPLEAÑOS ---
        function renderBirthdays() {
            const birthdaysGridEl = document.getElementById("birthdaysGrid");
            birthdaysGridEl.innerHTML = "";

            const currentMonth = currentDate.getMonth();

            // Ordenar por mes y luego por día de cumpleaños
            const sortedKids = [...kidsData].sort((a, b) => {
                if (a.birthMonth !== b.birthMonth) return a.birthMonth - b.birthMonth;
                return a.birthDay - b.birthDay;
            });

            sortedKids.forEach(kid => {
                const item = document.createElement("div");
                item.className = "birthday-item";
                
                const isCurrentMonth = kid.birthMonth === currentMonth;
                const isSelectedDay = (kid.birthMonth === selectedDate.getMonth() && kid.birthDay === selectedDate.getDate());

                if (isSelectedDay) {
                    item.classList.add("active-birthday-day");
                } else if (isCurrentMonth) {
                    item.classList.add("active-birthday-month");
                }

                const icon = isSelectedDay ? '🎂🎉' : (isCurrentMonth ? '🎉' : '🎂');
                const badgeExtra = isSelectedDay ? '<span style="color: #ec4899; font-size: 0.72rem; font-weight: 800; margin-left: 0.5rem; background: rgba(236,72,153,0.2); padding: 0.1rem 0.4rem; border-radius: 4px;">¡CUMPLEAÑOS HOY!</span>' : '';

                item.innerHTML = `
                    <div class="birthday-avatar">${icon}</div>
                    <span class="birthday-name">${kid.name} ${badgeExtra}</span>
                    <span class="birthday-date">${kid.birthDay} de ${monthNames[kid.birthMonth]}</span>
                `;

                birthdaysGridEl.appendChild(item);
            });
        }

        // --- 🚀 INICIALIZACIÓN ---
        window.onload = () => {
            initBackground();
            renderCalendar();
            renderSelectedDateDetails();
            renderBirthdays();
        };
    </script>
</body>

</html>
